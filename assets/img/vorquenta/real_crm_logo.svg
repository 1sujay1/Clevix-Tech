<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="cyanLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Cyan Glowing LED Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- 3D AI REAL ESTATE LOGO ICON MARK -->
  <g transform="translate(15, 10)">
    <!-- Hexagonal Obsidian Shield -->
    <path d="M 50 5 L 88 27 L 88 73 L 50 95 L 12 73 L 12 27 Z" fill="url(#shieldBg)" stroke="url(#goldLinear)" stroke-width="3" filter="url(#logoGlow)"/>

    <!-- 3D Tower & AI Circuit Nodes -->
    <!-- Tower Bar 1 (Short) -->
    <rect x="28" y="48" width="10" height="28" rx="2" fill="url(#goldLinear)"/>
    <!-- Tower Bar 2 (Tall Center) -->
    <rect x="44" y="26" width="12" height="50" rx="2" fill="url(#goldLinear)"/>
    <!-- Tower Bar 3 (Mid Right) -->
    <rect x="62" y="38" width="10" height="38" rx="2" fill="url(#goldLinear)"/>

    <!-- Roof Arch & AI Pulse Spark -->
    <path d="M 28 45 L 50 20 L 72 35" fill="none" stroke="url(#cyanLinear)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>
    <circle cx="50" cy="20" r="5" fill="#38BDF8" filter="url(#logoGlow)"/>

    <!-- 3D AI Lightning Node Cutout -->
    <path d="M 53 38 L 43 54 L 51 54 L 46 70 L 58 52 L 49 52 Z" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY: REAL CRM -->
  <!-- "Real" -->
  <text x="125" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="48" fill="#FFFFFF" letter-spacing="-0.5">Real</text>
  
  <!-- "CRM" with Gold Gradient -->
  <text x="228" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="48" fill="url(#goldLinear)" letter-spacing="1">CRM</text>

  <!-- Subtitle Tag: AI PLATFORM -->
  <text x="127" y="93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#06B6D4" letter-spacing="4">AI REAL ESTATE SAAS</text>

  <!-- Small AI Spark Indicator -->
  <circle cx="340" cy="45" r="4" fill="#38BDF8" filter="url(#logoGlow)"/>
</svg>
